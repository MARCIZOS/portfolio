<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kush Agarwal · Powers of Time</title>
    <meta name="description" content="Kush Agarwal, backend engineer. One continuous zoom through time, from a 1 ns cache hit to a 4-year degree, with his work on the way." />
    <meta name="theme-color" content="#0a0908" />
    <meta property="og:title" content="Kush Agarwal · Powers of Time" />
    <meta property="og:description" content="From 1 nanosecond to 4 years: a backend engineer's portfolio, told in latency." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23ffb000' stroke-width='3'/%3E%3Cpath d='M16 8v8l5 3' stroke='%23ffb000' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="world" aria-hidden="true"></canvas>
    <div id="labels" aria-hidden="true"></div>
    <div id="scrim" aria-hidden="true"></div>
    <div id="speed" aria-hidden="true"></div>
    <div id="vignette" aria-hidden="true"></div>
    <div id="lids" aria-hidden="true"><i></i><i></i></div>

    <header class="top">
      <a class="brand" href="#" aria-label="Kush Agarwal, home">kush agarwal <span>/ backend</span></a>
      <nav aria-label="Links">
        <a href="https://github.com/MARCIZOS" target="_blank" rel="noopener">GitHub</a>
        <a href="https://www.linkedin.com/in/kushagarwal0805/" target="_blank" rel="noopener">LinkedIn</a>
        <a href="mailto:kushagarwal0805@gmail.com">Email</a>
        <a class="skip" href="./resume.html">Skip the ride →</a>
      </nav>
    </header>

    <div class="hud" aria-hidden="true">
      <div class="box"><span class="k">timescale</span><b><span id="hud-num">1.00</span> <span id="hud-unit">ns</span></b></div>
      <div class="box"><span class="k">cpu cycles in view</span><b id="hud-cycles">3</b></div>
      <div class="box"><span class="k">stop</span><b id="count">01 / 14</b></div>
    </div>

    <div class="ruler" aria-hidden="true"><div class="needle"></div><div id="ruler-tape"></div></div>

    <main id="panels" class="panels"></main>
    <div id="announce" class="sr" aria-live="polite"></div>

    <div class="prompt" id="prompt" aria-hidden="true"><kbd>↓</kbd><span>to make time longer</span></div>
    <div class="edge" id="edge" role="status"></div>

    <div class="nav">
      <div class="dots" aria-label="Stops"></div>
      <button class="ctl" data-dir="-1" type="button" aria-label="Previous stop">↑</button>
      <button class="ctl primary" data-dir="1" type="button" aria-label="Next stop">↓</button>
    </div>

    <footer class="foot">
      <span id="time-on"></span>
      <button id="sound" type="button" aria-pressed="false">sound off</button>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
